schema: spec-driven

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

rules:
  design:
    - >-
      Every divergence from the reference configuration (the one defined by the detection-training
      and detection-model specs, which is the recorded configuration of the published SpotDetection-8
      model) must name its kind, "accuracy" or "quality-of-life", and cite a 3-seed
      ablation report (seeds 0, 1, 2) produced under the benchmark-evaluation protocol. An accuracy
      divergence is justified only if its mean reference-set F1 exceeds the reference mean by more
      than the reference seed range. A quality-of-life divergence is justified only if its mean F1
      is no lower than the reference mean minus that range and its benefit is measured and reported.
    - >-
      Every divergence from the decoding baseline (the hand-off and decoding defaults defined by the
      decoding-input and spot-decoding specs) must name its kind, "accuracy", "quality-of-life" or
      "output-identical", and cite a decoding-evaluation report that applies that kind's rule. The
      decoding seeds are 0, 1, 2 on the stored baseline hand-off with the pinned release checkpoint.
      An output-identical change must reproduce the baseline's seed-1 table row for row.
